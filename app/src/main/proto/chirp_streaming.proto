// Wire-compatible subset of google/cloud/texttospeech/v1/cloud_tts.proto.
// Source: https://github.com/googleapis/googleapis/blob/master/google/cloud/texttospeech/v1/cloud_tts.proto
syntax = "proto3";
package google.cloud.texttospeech.v1;
option java_package = "dev.genie.android.tts.proto";
option java_multiple_files = true;

message VoiceSelectionParams {
  string language_code = 1;
  string name = 2;
}
message StreamingAudioConfig {
  int32 audio_encoding = 1; // PCM = 7: headerless signed 16-bit little-endian audio.
  int32 sample_rate_hertz = 2;
  double speaking_rate = 3;
}
message StreamingSynthesizeConfig {
  VoiceSelectionParams voice = 1;
  StreamingAudioConfig streaming_audio_config = 4;
}
message StreamingSynthesisInput { string text = 1; }
message StreamingSynthesizeRequest {
  oneof streaming_request {
    StreamingSynthesizeConfig streaming_config = 1;
    StreamingSynthesisInput input = 2;
  }
}
message StreamingSynthesizeResponse { bytes audio_content = 1; }
